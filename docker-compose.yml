services:
  gptsovits-rs:
    image: ghcr.io/earthlyeric/gptsovits-rs:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptsovits-rs
    restart: unless-stopped
    gpus: all
    ports:
      - "9880:9880"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./voices.toml:/app/voices.toml:ro
      - ./models:/app/models
      - ./voices:/app/voices
    environment:
      - CUDA_VISIBLE_DEVICES=0
    # Keep this reservation for Compose implementations that do not support
    # the short `gpus` field. Requires nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
