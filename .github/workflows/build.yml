name: CI/CD & Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - "assets/**"
      - "voices/**"
      - "models/**"
      - ".gitignore"
      - "docker-compose.yml"
      - "openapi.json"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - "assets/**"
      - "voices/**"
      - "models/**"
      - ".gitignore"
      - "docker-compose.yml"
      - "openapi.json"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Run Unit and Integration Tests
  # ============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev ffmpeg

      - name: Cargo Check
        run: cargo check

      - name: Cargo Test
        run: cargo test --verbose

  # ============================================================================
  # 2. Build ONNX Runtime with CUDA 12.8 & Blackwell (sm_120) Support
  # ============================================================================
  build-onnxruntime-cuda12:
    name: Build ONNX Runtime (CUDA 12.8 + sm_120/sm_89/sm_86/sm_80/sm_75)
    needs: test
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.8.0-cudnn-devel-ubuntu24.04
    steps:
      - name: Cache ONNX Runtime Binary
        id: cache-ort
        uses: actions/cache@v6
        with:
          path: /tmp/ort-dist
          key: ort-cuda12.8-v1.22.2-v1

      - name: Build ONNX Runtime from Source
        if: steps.cache-ort.outputs.cache-hit != 'true'
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git cmake build-essential python3 python3-dev python3-pip curl ca-certificates libssl-dev

          pip3 install --no-cache-dir --break-system-packages flatbuffers packaging

          # v1.22.1+ switched the Eigen dependency from a GitLab-generated tarball
          # (non-deterministic, caused periodic SHA1 hash mismatches) to a stable
          # GitHub mirror, so no manual Eigen workaround is needed anymore.
          git clone --depth 1 --branch v1.22.2 --recursive https://github.com/microsoft/onnxruntime.git /tmp/onnxruntime

          cd /tmp/onnxruntime
          # 
          ./build.sh --allow_running_as_root --config Release --build_shared_lib --parallel --skip_tests \
            --use_cuda --cuda_home /usr/local/cuda --cudnn_home /usr/local/cuda \
            --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES="120;89;86;80;75"

          mkdir -p /tmp/ort-dist
          cp /tmp/onnxruntime/build/Linux/Release/libonnxruntime.so* /tmp/ort-dist/
          cp /tmp/onnxruntime/build/Linux/Release/libonnxruntime_providers_*.so /tmp/ort-dist/ 2>/dev/null || true

      - name: Upload ONNX Runtime Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: onnxruntime-cuda12.8
          path: /tmp/ort-dist/

  # ============================================================================
  # 3. Build Multi-Platform Release Binaries
  # ============================================================================
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: gptsovits-rs
            asset_name: gptsovits-rs-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: gptsovits-rs.exe
            asset_name: gptsovits-rs-windows-x86_64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
            chmod +x dist/${{ matrix.asset_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  # ============================================================================
  # 4. Build & Push Docker Image to GitHub Container Registry (ghcr.io)
  # ============================================================================
  docker-publish:
    name: Build & Publish Docker Image (GHCR)
    needs: [test, build-onnxruntime-cuda12]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Built ONNX Runtime with sm_120
        uses: actions/download-artifact@v8
        with:
          name: onnxruntime-cuda12.8
          path: ./ort_libs/
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max