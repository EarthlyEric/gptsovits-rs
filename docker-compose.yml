services:
  gptsovits-rs:
    image: ghcr.io/earthlyeric/gptsovits-rs:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gptsovits-rs
    restart: unless-stopped
    gpus: all
    ports:
      - "9880:9880"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./voices.toml:/app/voices.toml:ro
      - ./models:/app/models
      - ./voices:/app/voices
    environment:
      RUST_LOG: info,gptsovits_rs=info,tower_http=info,axum=info
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_HOME: /usr/local/cuda
      ORT_CUDA_LIB_DIR: /usr/local/cuda/lib64
      ORT_CUDNN_LIB_DIR: /usr/lib/x86_64-linux-gnu
      LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib:/usr/local/lib:/usr/local/bin
    # Keep this reservation for Compose implementations that do not support
    # the short `gpus` field. Requires nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
