name: CI/CD & Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - "assets/**"
      - "voices/**"
      - "models/**"
      - ".gitignore"
      - "docker-compose.yml"
      - "openapi.json"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "tools/**"
      - "assets/**"
      - "voices/**"
      - "models/**"
      - ".gitignore"
      - "docker-compose.yml"
      - "openapi.json"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Run Unit and Integration Tests
  # ============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev ffmpeg

      - name: Cargo Check
        run: cargo check

      - name: Cargo Test
        run: cargo test --verbose

  # ============================================================================
  # 2. Build Multi-Platform Release Binaries
  # ============================================================================
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: gptsovits-rs
            asset_name: gptsovits-rs-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: gptsovits-rs.exe
            asset_name: gptsovits-rs-windows-x86_64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
            chmod +x dist/${{ matrix.asset_name }}
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  # ============================================================================
  # 3. Build & Push Docker Image to GitHub Container Registry (ghcr.io)
  # ============================================================================
  # The image pulls the prebuilt CUDA ONNX Runtime tarball from the URL in the
  # ORT_LIBS_URL repository variable (Settings -> Secrets and variables ->
  # Actions -> Variables). Generate the tarball with
  # tools/onnxruntime_builder/build_ort_cuda.sh and upload it to Hugging Face.
  docker-publish:
    name: Build & Publish Docker Image (GHCR)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORT_LIBS_URL=${{ vars.ORT_LIBS_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
