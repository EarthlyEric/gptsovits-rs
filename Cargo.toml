[package]
name = "gptsovits-rs"
version = "0.1.0"
edition = "2021"
authors = ["earthlyeric6"]
description = "High-performance pure Rust inference engine and OpenAI-compatible TTS server for GPT-SoVITS (v1/v2/v2Pro/v2ProPlus/v3/v4)"

[dependencies]
# Web framework & Async runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1.6"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

# OpenAPI & Code-First Documentation Generation (FastAPI-like)
utoipa = { version = "5.3", features = ["openapi_extensions"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ONNX Runtime & Numerical Computing
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "copy-dylibs", "preload-dylibs", "ndarray", "cuda"] }
ndarray = { version = "0.17", features = ["std"] }
rustfft = "6.4"
rand = "0.8"

# Tokenization & Text processing
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }
regex = "1.10"
lazy_static = "1.4"

# Audio Processing & Encoding
hound = "3.5"
rubato = "0.15"
tempfile = "3.10"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
